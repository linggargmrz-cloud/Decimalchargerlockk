plugins { id 'com.android.application' }
android {
    namespace 'id.decimalcharge.lock'
    compileSdk 34
    defaultConfig {
        applicationId 'id.decimalcharge.lock'
        minSdk 26
        targetSdk 33
        versionCode Integer.parseInt(System.getenv("GITHUB_RUN_NUMBER") ?: "2")
        versionName '2.0'
    }
    signingConfigs {
        fixed {
            def ksPath = System.getenv("KEYSTORE_FILE")
            if (ksPath) {
                storeFile file(ksPath)
                storePassword System.getenv("KEYSTORE_PASS")
                keyAlias 'dcl'
                keyPassword System.getenv("KEYSTORE_PASS")
                storeType 'pkcs12'
            }
        }
    }
    buildTypes {
        debug {
            if (System.getenv("KEYSTORE_FILE")) signingConfig signingConfigs.fixed
        }
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
