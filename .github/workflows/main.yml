
name: Build Decimal Charge Lock APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: |
          ZIP=$(find . -maxdepth 1 -iname '*.zip' | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "ZIP project tidak ditemukan"
            exit 1
          fi
          mkdir project
          unzip -q "$ZIP" -d project
          find project -name gradlew -exec chmod +x {} \;

      - name: Build APK
        run: |
          WRAPPER=$(find project -name gradlew | head -n 1)
          if [ -z "$WRAPPER" ]; then
            echo "Gradle wrapper tidak ditemukan"
            exit 1
          fi
          cd "$(dirname "$WRAPPER")"
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DecimalChargeLock-APK
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
