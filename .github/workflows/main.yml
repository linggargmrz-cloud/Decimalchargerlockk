
name: Build Decimal Charge Lock APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract Android project
        run: |
          ZIP=$(find . -maxdepth 1 -iname '*.zip' | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ZIP project tidak ditemukan"
            exit 1
          fi

          mkdir project
          unzip -q "$ZIP" -d project

      - name: Build APK
        run: |
          SETTINGS=$(find project -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "File settings.gradle tidak ditemukan"
            exit 1
          fi

          cd "$(dirname "$SETTINGS")"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DecimalChargeLock-APK
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
