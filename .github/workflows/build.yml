name: Build APK
on: { push: { branches: [main, master] }, workflow_dispatch: {} }
jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Siapkan kunci tanda tangan
        env:
          KS_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/dcl.p12"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/dcl.p12" >> "$GITHUB_ENV"
          fi
      - run: gradle assembleDebug
      - run: cp app/build/outputs/apk/debug/app-debug.apk DecimalChargeLock.apk
      - uses: actions/upload-artifact@v4
        with: { name: DecimalChargeLock-apk, path: DecimalChargeLock.apk }
